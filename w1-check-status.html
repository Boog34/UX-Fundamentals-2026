<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --ink: #1c2333;
    --muted: #5d6679;
    --line: #dde2ec;
    --accent: #2f5bea;
    --accent-dark: #2448c4;
    --zone: #f8f9fc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--accent);
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 18px;
  }
  .brand { font-weight: 650; font-size: 20px; }
  .crumbs { margin-left: auto; color: var(--muted); font-size: 18px; }

  main {
    max-width: 720px;
    margin: 48px auto;
    padding: 0 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px;
    box-shadow: 0 1px 2px rgba(20, 30, 60, 0.04), 0 8px 24px rgba(20, 30, 60, 0.05);
  }
  h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.25; }
  .lead { margin: 0 0 28px; color: var(--muted); }

  .zone {
    border: 2px dashed #c5cde0;
    background: var(--zone);
    border-radius: 12px;
    padding: 40px 24px;
    text-align: center;
  }
  .zone svg { display: block; margin: 0 auto 12px; }
  .zone p { margin: 0 0 20px; color: var(--muted); }

  button.choose {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 12px 26px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.choose:hover { background: var(--accent-dark); }
  button.choose:focus-visible { outline: 3px solid #a9bcf7; outline-offset: 2px; }

  .result {
    min-height: 28px;
    margin-top: 16px;
    font-size: 18px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .result.shown { opacity: 1; }

  .hint { margin: 22px 0 0; color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
  <header>
    <div class="mark">N</div>
    <div class="brand">Northfield College</div>
    <div class="crumbs">Coursework &rsaquo; Design Studio 2</div>
  </header>

  <main>
    <section class="card">
      <h1>Hand in your project report</h1>
      <p class="lead">Attach your finished report so your tutor can read it before Friday's review.</p>

      <div class="zone">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2f5bea" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 3v5h5"></path>
          <path d="M12 17v-6"></path>
          <path d="M9.5 13.5 12 11l2.5 2.5"></path>
        </svg>
        <p>PDF, Word or PowerPoint, up to 25&nbsp;MB</p>
        <button type="button" class="choose" id="choose">Choose file</button>
        <div class="result" id="result" aria-live="polite"></div>
      </div>

      <p class="hint">Need a different format? Ask your tutor before the deadline.</p>
    </section>
  </main>

<script>
  (function () {
    var button = document.getElementById('choose');
    var result = document.getElementById('result');
    var timer = null;

    // handle click on the button
    button.addEventListener('click', function () {
      if (timer !== null) { return; }
      result.classList.remove('shown');
      result.textContent = '';
      timer = window.setTimeout(function () {
        timer = null;
        result.textContent = 'Done';
        result.classList.add('shown');
      }, 3000);
    });
  })();
</script>
</body>
</html>
