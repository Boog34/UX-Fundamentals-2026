<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery address – Harbour Home Delivery</title>
<style>
  :root {
    --teal: #0f766e;
    --teal-dark: #0b5a54;
    --teal-tint: #e3f1ef;
    --bg: #faf8f4;
    --ink: #1f2a2a;
    --muted: #5d6b6a;
    --line: #cfd8d6;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.45;
  }
  header {
    background: #fff;
    border-bottom: 4px solid var(--teal);
    padding: 14px 32px 12px;
  }
  .brand {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--teal-dark);
    letter-spacing: 0.01em;
  }
  .section-label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 32px 64px;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 6px;
  }
  .intro {
    margin: 0 0 28px;
    color: var(--muted);
  }
  .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 6px solid var(--teal);
    border-radius: 6px;
    padding: 28px 32px 32px;
  }
  .field { margin-bottom: 20px; }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    max-width: 420px;
    font: inherit;
    padding: 10px 12px;
    border: 1.5px solid #9fb0ad;
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input[type="text"]:focus {
    outline: 3px solid var(--teal-tint);
    border-color: var(--teal);
  }
  .field.eircode input { max-width: 200px; }
  .msg {
    min-height: 3.1em;
    margin-top: 6px;
    font-size: 18px;
    line-height: 1.4;
    color: var(--error);
  }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--teal);
    color: #fff;
    border: 0;
    border-radius: 4px;
    padding: 11px 26px;
    cursor: pointer;
  }
  button:hover { background: var(--teal-dark); }
  button:focus-visible { outline: 3px solid var(--teal-tint); outline-offset: 2px; }
  .done {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--teal-dark);
    padding: 12px 0;
  }
</style>
</head>
<body>
<header>
  <div class="brand">Harbour Home Delivery</div>
  <div class="section-label">My account</div>
</header>

<main>
  <h1>Delivery address</h1>
  <p class="intro">Where should we bring your orders?</p>

  <div class="panel" id="panel">
    <form id="addr-form" novalidate autocomplete="off">
      <div class="field">
        <label for="line1">Address line 1</label>
        <input type="text" id="line1" name="line1" value="14 Mill Lane">
      </div>
      <div class="field">
        <label for="town">Town</label>
        <input type="text" id="town" name="town" value="Ashbourne">
      </div>
      <div class="field eircode">
        <label for="eircode">Eircode</label>
        <input type="text" id="eircode" name="eircode" aria-describedby="eircode-msg">
        <div class="msg" id="eircode-msg" role="alert"></div>
      </div>
      <button type="submit">Save address</button>
    </form>
  </div>
</main>

<script>
(function () {
  var form = document.getElementById('addr-form');
  var panel = document.getElementById('panel');
  var input = document.getElementById('eircode');
  var msg = document.getElementById('eircode-msg');
  var pattern = /^(?:[A-Z][0-9]{2}|D6W) ?[A-Z0-9]{4}$/i;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    var value = input.value.trim();
    if (!pattern.test(value)) {
      msg.textContent = 'Enter a valid Eircode: 7 characters, for example D02 X285.';
      return;
    }
    panel.innerHTML = '<div class="done">Address saved.</div>';
  });
})();
</script>
</body>
</html>
