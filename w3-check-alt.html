<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4;display:flex;justify-content:center;padding:28px 16px}
button{font:inherit;color:inherit}
.app{width:100%;max-width:560px;background:#fff;border:1px solid #d5dbe1;border-radius:14px;overflow:hidden}
.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px;border-bottom:1px solid #e1e6eb;min-height:64px}
.header h1{margin:0;font-size:22px;grid-column:2;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:62px;padding:12px 20px;background:none;border:0;border-bottom:1px solid #eef1f4;text-align:left}
button.row{cursor:pointer}
button.row:hover{background:#f5f7f9}
.value{color:#5b6773}
.chevron{color:#8a95a1}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var SCREENS = {
  Account: [
    { label: 'Display name', value: 'Alex Morgan' },
    { label: 'Email', value: 'alex.morgan@example.com' },
    { label: 'Two-step sign-in', value: 'Off' }
  ],
  Privacy: [
    { label: 'Show my profile', value: 'Everyone' },
    { label: 'Class history', value: 'Private' },
    { label: 'Blocked users', value: 'None' }
  ],
  Notifications: [
    { label: 'Class reminders', value: 'On' },
    { label: 'Email digest', value: 'Off' },
    { label: 'Sound', value: 'On' }
  ]
};
var app = document.getElementById('app');

function showTop() {
  app.innerHTML = '<div class="header"><h1>Settings</h1></div>';
  Object.keys(SCREENS).forEach(function (name) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'row';
    b.innerHTML = '<span></span><span class="chevron" aria-hidden="true">&rsaquo;</span>';
    b.firstChild.textContent = name;
    b.addEventListener('click', function () { showSub(name); });
    app.appendChild(b);
  });
}

function showSub(name) {
  app.innerHTML = '';
  var head = document.createElement('div');
  head.className = 'header';
  var title = document.createElement('h1');
  title.textContent = name;
  head.appendChild(title);
  app.appendChild(head);
  SCREENS[name].forEach(function (item) {
    var row = document.createElement('div');
    row.className = 'row';
    var label = document.createElement('span');
    label.textContent = item.label;
    var v = document.createElement('span');
    v.className = 'value';
    v.textContent = item.value;
    row.appendChild(label);
    row.appendChild(v);
    app.appendChild(row);
  });
}

showTop();
</script>
</body>
</html>
