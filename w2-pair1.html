<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4}
[hidden]{display:none !important}
button{font:inherit}
.pair{display:flex;min-height:100vh}
.column{flex:1 1 0;min-width:0;padding:20px 32px;display:flex;flex-direction:column}
.rule{flex:0 0 1px;background:#b8c1cc}
.caption{font-size:18px;color:#5b6773;margin:0 0 12px}
.stage{background:#fff;border:1px solid #d5dbe1;border-radius:10px;padding:24px;position:relative}
.restart{align-self:flex-start;margin-top:14px;background:none;border:0;padding:4px 0;font-size:18px;color:#3a5a8c;text-decoration:underline;cursor:pointer}
.primary{background:#2f5fd0;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:18px;cursor:pointer}
h2{margin:0 0 16px;font-size:24px}
label{display:block;margin-bottom:14px}
input{display:block;width:100%;margin-top:4px;font:inherit;padding:9px 12px;border:2px solid #9aa5b1;border-radius:8px;background:#fff;color:inherit}
input.flagged{border-color:#c62828}
.linkButton{display:block;margin:14px 0 0;padding:0;background:none;border:0;color:#2f5fd0;cursor:pointer}
.linkButton:hover{text-decoration:underline;color:#1d3f96}
.msg{margin:14px 0 0;color:#c62828}
</style>
</head>
<body>
<div class="pair">
  <section class="column" id="panelA"></section>
  <div class="rule"></div>
  <section class="column" id="panelB"></section>
</div>
<script>
// build one panel; opts.message is the only difference
function createPanel(root, opts) {
  function render() {
    root.innerHTML =
      '<div class="caption">' + opts.caption + '</div>' +
      '<div class="stage">' +
        '<h2>Log in</h2>' +
        '<label>Email<input type="text" data-part="emailInput" autocomplete="off"></label>' +
        '<label>Password<input type="password" data-part="passwordInput" autocomplete="off"></label>' +
        '<button type="button" class="primary" data-part="submitButton">Log in</button>' +
        '<button type="button" class="linkButton" data-part="helpLink">Forgot password?</button>' +
        '<p class="msg" data-part="message" hidden></p>' +
      '</div>' +
      '<button type="button" class="restart" data-part="restart">Restart demo</button>';
    root.querySelector('[data-part="submitButton"]').addEventListener('click', handleSubmit);
    root.querySelector('[data-part="restart"]').addEventListener('click', render);
  }

  function handleSubmit() {
    root.querySelector('[data-part="passwordInput"]').classList.add('flagged');
    var msg = root.querySelector('[data-part="message"]');
    msg.textContent = opts.message;
    msg.hidden = false;
  }

  render();
}

createPanel(document.getElementById('panelA'), { caption: 'Version A', message: 'Error: 401.' });
createPanel(document.getElementById('panelB'), { caption: 'Version B', message: "That password doesn't match this email. Check for typos, or use 'Forgot password?' below." });
</script>
</body>
</html>
