<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4}
[hidden]{display:none !important}
button{font:inherit}
.pair{display:flex;min-height:100vh}
.column{flex:1 1 0;min-width:0;padding:32px}
.rule{flex:0 0 1px;background:#b8c1cc}
.stage{background:#fff;border:1px solid #d5dbe1;border-radius:10px;padding:24px;position:relative}
.primary{background:#2f5fd0;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:18px;cursor:pointer}
.primary:disabled{background:#c5ccd4;color:#7d8791;cursor:not-allowed}
h2{margin:0 0 16px;font-size:24px}
input{display:block;width:100%;margin-top:4px;font:inherit;padding:9px 12px;border:2px solid #9aa5b1;border-radius:8px;background:#fff;color:inherit}
input.flagged{border-color:#c62828}
label{display:block;margin-bottom:14px}
.msg{margin:14px 0 0;color:#c62828}
.msg.ok{color:#2e7d32}

.rules{list-style:none;margin:14px 0 0;padding:0}
.rules li{color:#7d8791}
.rules li.met{color:#2e7d32}
.rules li::before{content:"\25CB  "}
.rules li.met::before{content:"\2713  "}
.msg ul{margin:6px 0 0;padding-left:24px}
</style>
</head>
<body>
<div class="pair">
  <section class="column" id="panelA"></section>
  <div class="rule"></div>
  <section class="column" id="panelB"></section>
</div>
<script>
// build one panel; opts.liveList decides whether the rules are checked while typing
function createPanel(root, opts) {
  function hasLength(v) { return v.length >= 8; }
  function hasNumber(v) { return /\d/.test(v); }

  root.innerHTML =
    '<div class="stage">' +
      '<h2>Set a new password</h2>' +
      '<label>New password<input type="password" data-part="passwordInput" autocomplete="off"></label>' +
      (opts.liveList
        ? '<ul class="rules" data-part="rules"><li data-part="ruleLength">8+ characters</li><li data-part="ruleNumber">at least 1 number</li></ul>'
        : '') +
      '<button type="button" class="primary" data-part="saveButton" style="margin-top:14px"' + (opts.liveList ? ' disabled' : '') + '>Save</button>' +
      '<div class="msg" data-part="message" hidden></div>' +
    '</div>';

  var input = root.querySelector('[data-part="passwordInput"]');
  var save = root.querySelector('[data-part="saveButton"]');
  var msg = root.querySelector('[data-part="message"]');

  function handleInput() {
    msg.hidden = true;
    if (!opts.liveList) return;
    var v = input.value;
    root.querySelector('[data-part="ruleLength"]').classList.toggle('met', hasLength(v));
    root.querySelector('[data-part="ruleNumber"]').classList.toggle('met', hasNumber(v));
    save.disabled = !(hasLength(v) && hasNumber(v));
  }

  function handleSave() {
    var v = input.value;
    msg.hidden = false;
    if (hasLength(v) && hasNumber(v)) {
      msg.className = 'msg ok';
      msg.textContent = 'Password saved';
      return;
    }
    msg.className = 'msg';
    msg.innerHTML = 'Your password needs:<ul></ul>';
    var list = msg.querySelector('ul');
    [[!hasLength(v), 'At least 8 characters'], [!hasNumber(v), 'At least 1 number']].forEach(function (r) {
      if (!r[0]) return;
      var li = document.createElement('li');
      li.textContent = r[1];
      list.appendChild(li);
    });
  }

  input.addEventListener('input', handleInput);
  save.addEventListener('click', handleSave);
}

createPanel(document.getElementById('panelA'), { liveList: false });
createPanel(document.getElementById('panelB'), { liveList: true });
</script>
</body>
</html>
