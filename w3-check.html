<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4;display:flex;justify-content:center;padding:28px 16px}
button{font:inherit;color:inherit}
.app{width:100%;max-width:560px;background:#fff;border:1px solid #d5dbe1;border-radius:14px;overflow:hidden}
.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px;border-bottom:1px solid #e1e6eb;min-height:64px}
.header h1{margin:0;font-size:22px;grid-column:2;text-align:center}
.backButton{grid-column:1;justify-self:start;background:none;border:0;padding:6px 8px;color:#2f5fd0;cursor:pointer;display:flex;align-items:center;gap:6px}
.backButton:hover{text-decoration:underline}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:62px;padding:12px 20px;background:none;border:0;border-bottom:1px solid #eef1f4;text-align:left}
button.row{cursor:pointer}
button.row:hover{background:#f5f7f9}
.value{color:#5b6773}
.chevron{color:#8a95a1}
.toggle{position:relative;flex:0 0 auto;width:56px;height:32px;padding:0;border:0;border-radius:16px;background:#b9c0c8;cursor:pointer;transition:background-color .2s ease}
.knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s ease}
.toggle[aria-checked="true"]{background:#2e9e5b}
.toggle[aria-checked="true"] .knob{transform:translateX(24px)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var SCREENS = {
  Account: [
    { label: 'Display name', value: 'Alex Morgan' },
    { label: 'Email', value: 'alex.morgan@example.com' },
    { label: 'Two-step sign-in', slot: 'twoStep' }
  ],
  Privacy: [
    { label: 'Show my profile', slot: 'showProfile' },
    { label: 'Share class history', slot: 'shareHistory' },
    { label: 'Blocked users', value: 'None' }
  ],
  Notifications: [
    { label: 'Class reminders', slot: 'reminders' },
    { label: 'Email digest', slot: 'digest' },
    { label: 'Sound', slot: 'sound' }
  ]
};
var settingValues = { twoStep: false, showProfile: true, shareHistory: false, reminders: true, digest: false, sound: true };
var app = document.getElementById('app');

function showTop() {
  app.innerHTML = '<div class="header"><h1>Settings</h1></div>';
  Object.keys(SCREENS).forEach(function (name) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'row';
    b.innerHTML = '<span></span><span class="chevron" aria-hidden="true">&rsaquo;</span>';
    b.firstChild.textContent = name;
    b.addEventListener('click', function () { showSub(name); });
    app.appendChild(b);
  });
}

function showSub(name) {
  app.innerHTML = '';
  var head = document.createElement('div');
  head.className = 'header';
  var back = document.createElement('button');
  back.type = 'button';
  back.className = 'backButton';
  back.innerHTML = '<span aria-hidden="true">&larr;</span><span>Settings</span>';
  back.addEventListener('click', showTop);
  var title = document.createElement('h1');
  title.textContent = name;
  head.appendChild(back);
  head.appendChild(title);
  app.appendChild(head);
  SCREENS[name].forEach(function (item) {
    var row = document.createElement('div');
    row.className = 'row';
    var label = document.createElement('span');
    label.textContent = item.label;
    row.appendChild(label);
    if (item.slot) {
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'toggle';
      t.setAttribute('role', 'switch');
      t.setAttribute('aria-label', item.label);
      t.setAttribute('aria-checked', String(settingValues[item.slot]));
      t.innerHTML = '<span class="knob"></span>';
      t.addEventListener('click', function () {
        settingValues[item.slot] = !settingValues[item.slot];
        t.setAttribute('aria-checked', String(settingValues[item.slot]));
      });
      row.appendChild(t);
    } else {
      var v = document.createElement('span');
      v.className = 'value';
      v.textContent = item.value;
      row.appendChild(v);
    }
    app.appendChild(row);
  });
}

showTop();
</script>
</body>
</html>
