<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4}
[hidden]{display:none !important}
button{font:inherit}
.pair{display:flex;min-height:100vh}
.column{flex:1 1 0;min-width:0;padding:20px 32px;display:flex;flex-direction:column}
.rule{flex:0 0 1px;background:#b8c1cc}
.caption{font-size:18px;color:#5b6773;margin:0 0 12px}
.stage{background:#fff;border:1px solid #d5dbe1;border-radius:10px;padding:24px;position:relative}
.restart{align-self:flex-start;margin-top:14px;background:none;border:0;padding:4px 0;font-size:18px;color:#3a5a8c;text-decoration:underline;cursor:pointer}
.primary{background:#2f5fd0;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:18px;cursor:pointer}
.primary:disabled{opacity:.7;cursor:default}
h2{margin:0 0 16px;font-size:24px}
label{display:block;margin-bottom:14px}
input[type=text]{display:block;width:100%;margin-top:4px;font:inherit;padding:9px 12px;border:1px solid #9aa5b1;border-radius:8px;background:#fff;color:inherit}
/* save button */
.saveButton{min-width:190px;height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.saveButton.done{background:#2e7d32}
.saveButton.done:disabled{opacity:1}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="pair">
  <section class="column" id="panelA"></section>
  <div class="rule"></div>
  <section class="column" id="panelB"></section>
</div>
<script>
// build one panel; opts.showSteps decides whether the button changes after a click
function createPanel(root, opts) {
  var timers = [];
  var savedValues = null;

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function render() {
    clearTimers();
    savedValues = null;
    root.innerHTML =
      '<div class="caption">' + opts.caption + '</div>' +
      '<div class="stage">' +
        '<h2>Settings</h2>' +
        '<label>Display name<input type="text" data-part="field1" value="Alex Morgan"></label>' +
        '<label>Email<input type="text" data-part="field2" value="alex.morgan@example.com"></label>' +
        '<label>City<input type="text" data-part="field3" value="Dublin"></label>' +
        '<button type="button" class="primary saveButton" data-part="saveButton">Save changes</button>' +
      '</div>' +
      '<button type="button" class="restart" data-part="restart">Restart demo</button>';
    root.querySelector('[data-part="saveButton"]').addEventListener('click', handleSave);
    root.querySelector('[data-part="restart"]').addEventListener('click', render);
  }

  function setButton(kind) {
    var btn = root.querySelector('[data-part="saveButton"]');
    if (kind === 'busy') {
      btn.disabled = true;
      btn.className = 'primary saveButton busy';
      btn.innerHTML = '<span class="spinner" role="img" aria-label="Saving"></span>';
    } else if (kind === 'done') {
      btn.disabled = true;
      btn.className = 'primary saveButton done';
      btn.innerHTML = '<span aria-hidden="true">&#10003;</span><span>Saved</span>';
    } else {
      btn.disabled = false;
      btn.className = 'primary saveButton';
      btn.textContent = 'Save changes';
    }
  }

  function handleSave() {
    savedValues = {
      name: root.querySelector('[data-part="field1"]').value,
      email: root.querySelector('[data-part="field2"]').value,
      city: root.querySelector('[data-part="field3"]').value
    };
    if (!opts.showSteps) return;
    setButton('busy');
    later(function () {
      setButton('done');
      later(function () { setButton('normal'); }, 2000);
    }, 800);
  }

  render();
}

createPanel(document.getElementById('panelA'), { caption: 'Version A', showSteps: true });
createPanel(document.getElementById('panelB'), { caption: 'Version B', showSteps: false });
</script>
</body>
</html>
