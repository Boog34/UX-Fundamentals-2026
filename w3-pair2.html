<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4}
[hidden]{display:none !important}
button{font:inherit}
.pair{display:flex;min-height:100vh}
.column{flex:1 1 0;min-width:0;padding:20px 32px;display:flex;flex-direction:column}
.rule{flex:0 0 1px;background:#b8c1cc}
.caption{font-size:18px;color:#5b6773;margin:0 0 12px}
.stage{background:#fff;border:1px solid #d5dbe1;border-radius:10px;position:relative;height:440px;overflow:hidden}
.restart{align-self:flex-start;margin-top:14px;background:none;border:0;padding:4px 0;font-size:18px;color:#3a5a8c;text-decoration:underline;cursor:pointer}
h2{margin:0;padding:16px 20px;font-size:24px;border-bottom:1px solid #d5dbe1}
.email{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #e6eaee}
.emailText{flex:1 1 auto;min-width:0}
.sender{font-weight:600;display:block}
.subject{display:block;color:#4a5560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deleteButton{flex:0 0 auto;background:#fff;color:#7a1b1b;border:1px solid #c62828;border-radius:8px;padding:6px 16px;font-size:18px;cursor:pointer}
.snackbar{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:12px;background:#2b333b;color:#fff;border-radius:8px;padding:12px 18px}
.snackAction{background:none;border:0;padding:0;color:#8fb5ff;font-weight:600;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="pair">
  <section class="column" id="panelA"></section>
  <div class="rule"></div>
  <section class="column" id="panelB"></section>
</div>
<script>
var SAMPLE_EMAILS = [
  { id: 1, sender: 'Maria Lopez', subject: 'Schedule change for Thursday' },
  { id: 2, sender: 'Studio Team', subject: 'Your class pass is ready' },
  { id: 3, sender: 'Sam Patel', subject: 'Notes from last week' },
  { id: 4, sender: 'Front Desk', subject: 'Reminder about the lost property box' }
];

// build one panel; opts.canUndo decides whether a delete can be reversed
function createPanel(root, opts) {
  var removed = {};
  var pendingId = null;
  var timer = null;

  function render() {
    clearTimeout(timer);
    removed = {};
    pendingId = null;
    root.innerHTML =
      '<div class="caption">' + opts.caption + '</div>' +
      '<div class="stage">' +
        '<h2>Inbox</h2>' +
        '<div data-part="list"></div>' +
        '<div class="snackbar" data-part="snackbar" hidden><span>Email deleted &mdash;</span><button type="button" class="snackAction" data-part="undoButton">Undo</button></div>' +
      '</div>' +
      '<button type="button" class="restart" data-part="restart">Restart demo</button>';
    root.querySelector('[data-part="undoButton"]').addEventListener('click', handleUndo);
    root.querySelector('[data-part="restart"]').addEventListener('click', render);
    renderList();
  }

  function renderList() {
    var list = root.querySelector('[data-part="list"]');
    list.innerHTML = '';
    SAMPLE_EMAILS.forEach(function (mail) {
      if (removed[mail.id]) return;
      var row = document.createElement('div');
      row.className = 'email';
      row.setAttribute('data-part', 'email');
      var text = document.createElement('div');
      text.className = 'emailText';
      var s = document.createElement('span');
      s.className = 'sender';
      s.textContent = mail.sender;
      var t = document.createElement('span');
      t.className = 'subject';
      t.textContent = mail.subject;
      text.appendChild(s);
      text.appendChild(t);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'deleteButton';
      b.setAttribute('data-part', 'deleteButton');
      b.textContent = 'Delete';
      b.addEventListener('click', function () { handleDelete(mail.id); });
      row.appendChild(text);
      row.appendChild(b);
      list.appendChild(row);
    });
  }

  function handleDelete(id) {
    removed[id] = true;
    renderList();
    if (!opts.canUndo) return;
    pendingId = id;
    var bar = root.querySelector('[data-part="snackbar"]');
    bar.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(function () {
      bar.hidden = true;
      pendingId = null;
    }, 5000);
  }

  function handleUndo() {
    if (pendingId === null) return;
    delete removed[pendingId];
    pendingId = null;
    clearTimeout(timer);
    root.querySelector('[data-part="snackbar"]').hidden = true;
    renderList();
  }

  render();
}

createPanel(document.getElementById('panelA'), { caption: 'Version A', canUndo: true });
createPanel(document.getElementById('panelB'), { caption: 'Version B', canUndo: false });
</script>
</body>
</html>
