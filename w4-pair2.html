<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4}
[hidden]{display:none !important}
button{font:inherit}
.pair{display:flex;min-height:100vh}
.column{flex:1 1 0;min-width:0;padding:20px 32px;display:flex;flex-direction:column}
.rule{flex:0 0 1px;background:#b8c1cc}
.caption{font-size:18px;color:#5b6773;margin:0 0 12px}
.stage{background:#fff;border:1px solid #d5dbe1;border-radius:10px;padding:24px;position:relative;min-height:320px}
.restart{align-self:flex-start;margin-top:14px;background:none;border:0;padding:4px 0;font-size:18px;color:#3a5a8c;text-decoration:underline;cursor:pointer}
.primary{background:#2f5fd0;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:18px;cursor:pointer}
h2{margin:0 0 4px;font-size:24px}
.stock{margin:0 0 16px;color:#4a5560}
.fieldLabel{display:block;margin-bottom:6px}
.qtyRow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.qtyBox{width:90px;height:48px;padding:0 12px;border:1px solid #9aa5b1;border-radius:8px;background:#fff;color:inherit;font:inherit;text-align:center;display:flex;align-items:center;justify-content:center}
.stepButton{width:48px;height:48px;padding:0;border:1px solid #9aa5b1;border-radius:8px;background:#fff;color:#1f2933;font-size:24px;line-height:1;cursor:pointer}
.stepButton:disabled{background:#eceff2;color:#a9b2bc;border-color:#d5dbe1;cursor:not-allowed}
.msg{margin:14px 0 0;min-height:27px;color:#c62828}
.msg.ok{color:#2e7d32}
</style>
</head>
<body>
<div class="pair">
  <section class="column" id="panelA"></section>
  <div class="rule"></div>
  <section class="column" id="panelB"></section>
</div>
<script>
// build one panel; opts.useSteppers decides how the quantity is entered
function createPanel(root, opts) {
  var qty = 1;

  function render() {
    qty = 1;
    root.innerHTML =
      '<div class="caption">' + opts.caption + '</div>' +
      '<div class="stage">' +
        '<h2>Studio water bottle</h2>' +
        '<p class="stock">12 in stock</p>' +
        '<span class="fieldLabel" id="' + root.id + 'Label">Quantity</span>' +
        '<div class="qtyRow" data-part="qtyRow"></div>' +
        '<button type="button" class="primary" data-part="addButton">Add to basket</button>' +
        '<p class="msg" data-part="message"></p>' +
      '</div>' +
      '<button type="button" class="restart" data-part="restart">Restart demo</button>';
    var row = root.querySelector('[data-part="qtyRow"]');
    if (opts.useSteppers) buildSteppers(row); else buildInput(row);
    root.querySelector('[data-part="addButton"]').addEventListener('click', handleAdd);
    root.querySelector('[data-part="restart"]').addEventListener('click', render);
  }

  function buildSteppers(row) {
    row.innerHTML =
      '<button type="button" class="stepButton" data-part="minus" aria-label="Decrease quantity">&ndash;</button>' +
      '<div class="qtyBox" data-part="qtyValue"></div>' +
      '<button type="button" class="stepButton" data-part="plus" aria-label="Increase quantity">+</button>';
    row.querySelector('[data-part="minus"]').addEventListener('click', function () { handleStep(-1); });
    row.querySelector('[data-part="plus"]').addEventListener('click', function () { handleStep(1); });
    showStepper();
  }

  function showStepper() {
    root.querySelector('[data-part="qtyValue"]').textContent = String(qty);
    root.querySelector('[data-part="minus"]').disabled = qty <= 1;
    root.querySelector('[data-part="plus"]').disabled = qty >= 12;
  }

  function buildInput(row) {
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'qtyBox';
    input.value = '1';
    input.autocomplete = 'off';
    input.setAttribute('data-part', 'qtyValue');
    input.setAttribute('aria-labelledby', root.id + 'Label');
    input.addEventListener('input', clearMessage);
    row.appendChild(input);
  }

  function handleStep(delta) {
    qty += delta;
    showStepper();
    clearMessage();
  }

  function clearMessage() {
    var msg = root.querySelector('[data-part="message"]');
    msg.textContent = '';
    msg.className = 'msg';
  }

  function handleAdd() {
    var n = qty;
    if (!opts.useSteppers) {
      var text = root.querySelector('[data-part="qtyValue"]').value.trim();
      n = /^\d+$/.test(text) ? Number(text) : NaN;
    }
    var msg = root.querySelector('[data-part="message"]');
    if (n >= 1 && n <= 12) {
      msg.textContent = 'Added to basket';
      msg.className = 'msg ok';
    } else {
      msg.textContent = 'Quantity must be between 1 and 12';
      msg.className = 'msg';
    }
  }

  render();
}

createPanel(document.getElementById('panelA'), { caption: 'Version A', useSteppers: true });
createPanel(document.getElementById('panelB'), { caption: 'Version B', useSteppers: false });
</script>
</body>
</html>
