<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1d2330;
    --muted: #667085;
    --line: #dfe3ea;
    --accent: #2f5bea;
    --accent-dark: #2447c2;
    --err-bg: #fdecec;
    --err-line: #e5484d;
    --err-ink: #8a1c1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    color: var(--ink);
    background: var(--bg);
  }
  .stage { display: grid; grid-template-columns: 1fr 1px 1fr; min-height: 100vh; }
  .rule { background: #c9d0dc; }
  .panel { padding: 24px 32px; display: flex; flex-direction: column; align-items: center; }
  .caption { font-size: 16px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 40px; align-self: flex-start; }

  .checkout {
    width: 100%; max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 8px 28px rgba(20, 30, 60, 0.08);
  }
  h1 { font-size: 26px; margin: 0 0 20px; font-weight: 650; }
  .total { display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .total strong { font-size: 22px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid #c8cfda;
    border-radius: 9px;
    margin-bottom: 22px;
    letter-spacing: 0.04em;
  }
  input:focus { outline: 3px solid rgba(47, 91, 234, 0.35); border-color: var(--accent); }

  .banner {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--err-bg);
    border: 1px solid var(--err-line);
    border-left-width: 5px;
    color: var(--err-ink);
    border-radius: 9px;
    padding: 14px 16px;
    margin-bottom: 16px;
    line-height: 1.45;
  }
  .banner[hidden] { display: none; }
  .banner span { flex: 1; }
  .banner button {
    flex: none;
    background: #fff;
    color: var(--err-ink);
    border: 1px solid var(--err-line);
    padding: 8px 14px;
  }
  .banner button:hover { background: #fff5f5; }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 9px; padding: 12px 22px; border: 1px solid transparent;
  }
  button:focus-visible { outline: 3px solid rgba(47, 91, 234, 0.45); outline-offset: 2px; }
  .pay { width: 100%; background: var(--accent); color: #fff; font-size: 19px; }
  .pay:hover { background: var(--accent-dark); }

  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; }
    .rule { height: 1px; }
    .banner { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
  <div class="stage">
    <section class="panel" data-message="Your card was declined. Double-check the card number, or try a different card." aria-label="Version A">
      <div class="caption">Version A</div>
      <div class="checkout">
        <h1>Checkout</h1>
        <div class="total"><span>Order total</span><strong>€48.00</strong></div>
        <label for="card-a">Card number</label>
        <input id="card-a" class="card" type="text" inputmode="numeric" autocomplete="off" value="4111 1111 1111 1111">
        <div class="banner" role="alert" hidden>
          <span class="msg"></span>
          <button class="retry" type="button">Try a different card</button>
        </div>
        <button class="pay" type="button">Pay now</button>
      </div>
    </section>

    <div class="rule" aria-hidden="true"></div>

    <section class="panel" data-message="Something went wrong. Please try again." aria-label="Version B">
      <div class="caption">Version B</div>
      <div class="checkout">
        <h1>Checkout</h1>
        <div class="total"><span>Order total</span><strong>€48.00</strong></div>
        <label for="card-b">Card number</label>
        <input id="card-b" class="card" type="text" inputmode="numeric" autocomplete="off" value="4111 1111 1111 1111">
        <div class="banner" role="alert" hidden>
          <span class="msg"></span>
          <button class="retry" type="button">Try a different card</button>
        </div>
        <button class="pay" type="button">Pay now</button>
      </div>
    </section>
  </div>

<script>
(function () {
  Array.prototype.forEach.call(document.querySelectorAll(".panel"), function (panel) {
    var banner = panel.querySelector(".banner");
    var msg = panel.querySelector(".msg");
    var card = panel.querySelector(".card");

    panel.querySelector(".pay").addEventListener("click", function () {
      msg.textContent = panel.getAttribute("data-message");
      banner.hidden = false;
    });

    panel.querySelector(".retry").addEventListener("click", function () {
      banner.hidden = true;
      card.value = "";
      card.focus();
    });
  });
})();
</script>
</body>
</html>
