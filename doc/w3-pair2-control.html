<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #cfd5dd;
    --accent: #2563eb;
    --danger: #c62828;
    --danger-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.4;
  }
  .stage {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 40px;
  }
  .rule { background: var(--border); }
  .caption {
    font-size: 18px;
    color: var(--muted);
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  .frame {
    position: relative;
    height: 540px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .frame h2 {
    margin: 0;
    padding: 20px 24px;
    font-size: 24px;
    border-bottom: 1px solid var(--border);
  }
  .list { list-style: none; margin: 0; padding: 0; }
  .mail {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  .mail .text { flex: 1; min-width: 0; }
  .mail .from { font-weight: 700; }
  .mail .subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail .preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail .time { color: var(--muted); flex: none; }
  button.delete {
    flex: none;
    font: inherit;
    font-weight: 600;
    height: 44px;
    padding: 0 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--danger);
    cursor: pointer;
  }
  button.delete:hover { background: var(--danger-bg); border-color: var(--danger); }
  .empty { padding: 32px 24px; color: var(--muted); }

  .toasts {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 18px;
    border-radius: 8px;
    background: #1f2933;
    color: #fff;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }
  .toast button {
    font: inherit;
    font-weight: 700;
    padding: 4px 6px;
    border: 0;
    background: none;
    color: #8fb4ff;
    text-decoration: underline;
    cursor: pointer;
  }

  @media (max-width: 800px) {
    .stage { grid-template-columns: 1fr; }
    .rule { width: 100%; height: 1px; }
  }
</style>
</head>
<body>
<div class="stage">
  <section>
    <p class="caption">Version A</p>
    <div class="frame" id="frame-a"></div>
  </section>
  <div class="rule" aria-hidden="true"></div>
  <section>
    <p class="caption">Version B</p>
    <div class="frame" id="frame-b"></div>
  </section>
</div>

<script>
(function () {
  var MAILS = [
    { id: 1, from: 'Maya Okafor',   subject: 'Lunch on Thursday?',        preview: 'There’s a new place near the station if you fancy it.', time: '9:41' },
    { id: 2, from: 'Riverside Library', subject: 'Your book is ready to collect', preview: 'It will be held at the front desk until Saturday.',    time: '9:12' },
    { id: 3, from: 'Tom Hendry',    subject: 'Updated schedule for next week', preview: 'I’ve moved the Tuesday meeting to the afternoon.',   time: 'Yesterday' },
    { id: 4, from: 'Priya Nair',    subject: 'Photos from the weekend',   preview: 'Here are the best ones from the hike — the last one is my favourite.', time: 'Yesterday' }
  ];

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }

  function build(frame, allowUndo) {
    var mails = MAILS.map(function (m) {
      return { id: m.id, from: m.from, subject: m.subject, preview: m.preview, time: m.time, removed: false };
    });

    frame.appendChild(el('h2', null, 'Inbox'));
    var list = el('ul', 'list');
    frame.appendChild(list);
    var toasts = el('div', 'toasts');
    frame.appendChild(toasts);

    function render() {
      list.innerHTML = '';
      var shown = mails.filter(function (m) { return !m.removed; });
      if (!shown.length) {
        var li = el('li', 'empty', 'Your inbox is empty.');
        list.appendChild(li);
        return;
      }
      shown.forEach(function (m) {
        var li = el('li', 'mail');
        var text = el('div', 'text');
        text.appendChild(el('div', 'from', m.from));
        text.appendChild(el('div', 'subject', m.subject));
        text.appendChild(el('div', 'preview', m.preview));
        li.appendChild(text);
        li.appendChild(el('span', 'time', m.time));
        var del = el('button', 'delete', 'Delete');
        del.type = 'button';
        del.setAttribute('aria-label', 'Delete email from ' + m.from);
        del.addEventListener('click', function () { remove(m); });
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function remove(m) {
      m.removed = true;
      render();
      if (!allowUndo) {
        mails.splice(mails.indexOf(m), 1);
        return;
      }
      var toast = el('div', 'toast');
      toast.setAttribute('role', 'status');
      toast.appendChild(el('span', null, 'Email deleted —'));
      var undo = el('button', null, 'Undo');
      undo.type = 'button';
      toast.appendChild(undo);
      toasts.appendChild(toast);

      var timer = setTimeout(function () {
        toast.remove();
        mails.splice(mails.indexOf(m), 1);
      }, 5000);

      undo.addEventListener('click', function () {
        clearTimeout(timer);
        toast.remove();
        m.removed = false;
        render();
      });
    }

    render();
  }

  build(document.getElementById('frame-a'), true);
  build(document.getElementById('frame-b'), false);
})();
</script>
</body>
</html>
