<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4}
[hidden]{display:none !important}
button{font:inherit}
.pair{display:flex;min-height:100vh}
.column{flex:1 1 0;min-width:0;padding:20px 32px;display:flex;flex-direction:column}
.rule{flex:0 0 1px;background:#b8c1cc}
.caption{font-size:18px;color:#5b6773;margin:0 0 12px}
.stage{background:#fff;border:1px solid #d5dbe1;border-radius:10px;position:relative;height:440px;overflow:hidden}
.restart{align-self:flex-start;margin-top:14px;background:none;border:0;padding:4px 0;font-size:18px;color:#3a5a8c;text-decoration:underline;cursor:pointer}
.primary{background:#2f5fd0;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:18px;cursor:pointer}
.plain{background:#fff;color:#1f2933;border:1px solid #9aa5b1;border-radius:8px;padding:9px 20px;font-size:18px;cursor:pointer}
h2{margin:0 0 12px;font-size:24px}
h3{margin:0;font-size:22px}
.page{padding:24px}
.page p{margin:0 0 18px}
.overlay{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(20,28,36,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.box{position:relative;width:100%;max-width:400px;background:#fff;border-radius:12px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.boxHead{min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.closeButton{width:36px;height:36px;border:0;border-radius:50%;background:#e6eaee;color:#1f2933;font-size:18px;line-height:1;cursor:pointer}
.stepLabel{margin:4px 0 14px;color:#5b6773}
.boxBody{min-height:120px}
.boxBody label{display:block}
.boxBody input{display:block;width:100%;margin-top:4px;font:inherit;padding:9px 12px;border:1px solid #9aa5b1;border-radius:8px}
.photo{width:110px;height:110px;border:2px dashed #9aa5b1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#5b6773;margin:0 auto}
.boxFoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.boxFoot .backButton{margin-right:auto}
</style>
</head>
<body>
<div class="pair">
  <section class="column" id="panelA"></section>
  <div class="rule"></div>
  <section class="column" id="panelB"></section>
</div>
<script>
// build one panel; opts.canLeave decides whether the box has a close button and a back button
function createPanel(root, opts) {
  var step = 1;
  var data = { name: '' };

  function render() {
    step = 1;
    data = { name: '' };
    root.innerHTML =
      '<div class="caption">' + opts.caption + '</div>' +
      '<div class="stage">' +
        '<div class="page">' +
          '<h2>Your account</h2>' +
          '<p>Your profile has not been filled in yet.</p>' +
          '<button type="button" class="primary" data-part="openButton">Set up your profile</button>' +
        '</div>' +
        '<div class="overlay" data-part="overlay" hidden><div class="box" data-part="box"></div></div>' +
      '</div>' +
      '<button type="button" class="restart" data-part="restart">Restart demo</button>';
    root.querySelector('[data-part="openButton"]').addEventListener('click', handleOpen);
    root.querySelector('[data-part="restart"]').addEventListener('click', render);
  }

  function handleOpen() {
    step = 1;
    data = { name: '' };
    root.querySelector('[data-part="overlay"]').hidden = false;
    renderBox();
  }

  function handleClose() {
    root.querySelector('[data-part="overlay"]').hidden = true;
  }

  function saveInput() {
    var input = root.querySelector('[data-part="nameInput"]');
    if (input) data.name = input.value;
  }

  function renderBox() {
    var box = root.querySelector('[data-part="box"]');
    var body = '';
    if (step === 1) {
      body = '<label>Name<input type="text" data-part="nameInput" autocomplete="off"></label>';
    } else if (step === 2) {
      body = '<div class="photo">Photo</div>';
    } else {
      body = '<p>You are all set.</p><p data-part="summary"></p>';
    }
    box.innerHTML =
      '<div class="boxHead"><h3>Set up your profile</h3>' +
        (opts.canLeave ? '<button type="button" class="closeButton" data-part="closeButton" aria-label="Close">&#10005;</button>' : '') +
      '</div>' +
      '<p class="stepLabel">Step ' + step + ' of 3</p>' +
      '<div class="boxBody">' + body + '</div>' +
      '<div class="boxFoot">' +
        (opts.canLeave && step > 1 ? '<button type="button" class="plain backButton" data-part="backButton">Back</button>' : '') +
        '<button type="button" class="primary" data-part="nextButton">' + (step === 3 ? 'Finish' : 'Next') + '</button>' +
      '</div>';
    if (step === 1) {
      var input = box.querySelector('[data-part="nameInput"]');
      input.value = data.name;
      input.focus();
    }
    if (step === 3) {
      box.querySelector('[data-part="summary"]').textContent = 'Name: ' + data.name;
    }
    box.querySelector('[data-part="nextButton"]').addEventListener('click', handleNext);
    var back = box.querySelector('[data-part="backButton"]');
    if (back) back.addEventListener('click', handleBack);
    var close = box.querySelector('[data-part="closeButton"]');
    if (close) close.addEventListener('click', handleClose);
  }

  function handleNext() {
    saveInput();
    if (step === 3) { handleClose(); return; }
    step += 1;
    renderBox();
  }

  function handleBack() {
    saveInput();
    step -= 1;
    renderBox();
  }

  render();
}

createPanel(document.getElementById('panelA'), { caption: 'Version A', canLeave: true });
createPanel(document.getElementById('panelB'), { caption: 'Version B', canLeave: false });
</script>
</body>
</html>
