<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #cfd5dd;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --danger: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.4;
  }
  .stage {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 40px;
  }
  .rule { background: var(--border); }
  .caption {
    font-size: 18px;
    color: var(--muted);
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .card h2 { margin: 0 0 20px; font-size: 24px; }
  .field { margin-bottom: 18px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input.invalid { border: 2px solid var(--danger); padding: 9px 11px; }
  .actions { margin-top: 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  button.primary {
    font: inherit;
    font-weight: 600;
    height: 52px;
    min-width: 140px;
    padding: 0 24px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.link {
    font: inherit;
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
  }
  .error {
    margin: 16px 0 0;
    min-height: 26px;
    color: var(--danger);
    font-size: 18px;
  }
  .forgot { margin: 8px 0 0; }
  .note { margin: 12px 0 0; color: var(--muted); min-height: 26px; }

  @media (max-width: 800px) {
    .stage { grid-template-columns: 1fr; }
    .rule { width: 100%; height: 1px; }
  }
</style>
</head>
<body>
<div class="stage">

  <section>
    <p class="caption">Version A</p>
    <form class="card" id="form-a" novalidate autocomplete="off">
      <h2>Log in</h2>
      <div class="field">
        <label for="a-email">Email</label>
        <input type="email" id="a-email" value="jordan.ellis@example.com">
      </div>
      <div class="field">
        <label for="a-pass">Password</label>
        <input type="password" id="a-pass" value="sunflower22">
      </div>
      <div class="actions">
        <button type="submit" class="primary">Log in</button>
      </div>
      <p class="error" id="error-a" role="alert"></p>
      <p class="forgot"><button type="button" class="link" id="forgot-a">Forgot password</button></p>
      <p class="note" id="note-a"></p>
    </form>
  </section>

  <div class="rule" aria-hidden="true"></div>

  <section>
    <p class="caption">Version B</p>
    <form class="card" id="form-b" novalidate autocomplete="off">
      <h2>Log in</h2>
      <div class="field">
        <label for="b-email">Email</label>
        <input type="email" id="b-email" value="jordan.ellis@example.com">
      </div>
      <div class="field">
        <label for="b-pass">Password</label>
        <input type="password" id="b-pass" value="sunflower22">
      </div>
      <div class="actions">
        <button type="submit" class="primary">Log in</button>
      </div>
      <p class="error" id="error-b" role="alert"></p>
      <p class="forgot"><button type="button" class="link" id="forgot-b">Forgot password</button></p>
      <p class="note" id="note-b"></p>
    </form>
  </section>

</div>

<script>
(function () {
  function wire(id, message) {
    var form = document.getElementById('form-' + id);
    var pass = document.getElementById(id + '-pass');
    var error = document.getElementById('error-' + id);
    var note = document.getElementById('note-' + id);
    var forgot = document.getElementById('forgot-' + id);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      note.textContent = '';
      pass.classList.add('invalid');
      error.textContent = message;
    });

    forgot.addEventListener('click', function () {
      note.textContent = 'A reset link would be sent to your email address.';
    });
  }

  wire('a', 'Error: 401.');
  wire('b', 'That password doesn’t match this email. Check for typos, or use ‘Forgot password’ below.');
})();
</script>
</body>
</html>
