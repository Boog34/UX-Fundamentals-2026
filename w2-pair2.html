<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#eef1f4}
[hidden]{display:none !important}
button{font:inherit}
.pair{display:flex;min-height:100vh}
.column{flex:1 1 0;min-width:0;padding:20px 32px;display:flex;flex-direction:column}
.rule{flex:0 0 1px;background:#b8c1cc}
.caption{font-size:18px;color:#5b6773;margin:0 0 12px}
.stage{background:#fff;border:1px solid #d5dbe1;border-radius:10px;padding:24px;position:relative;min-height:340px}
.restart{align-self:flex-start;margin-top:14px;background:none;border:0;padding:4px 0;font-size:18px;color:#3a5a8c;text-decoration:underline;cursor:pointer}
.primary{background:#2f5fd0;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:18px;cursor:pointer}
.secondary{background:#fff;color:#7a1b1b;border:1px solid #c62828;border-radius:8px;padding:8px 16px;font-size:18px;cursor:pointer;flex:0 0 auto}
h2{margin:0 0 16px;font-size:24px}
.line{margin:0 0 12px}
.cardRow{min-height:48px;margin:0 0 16px;display:flex;align-items:center}
.cardRow input{width:100%;font:inherit;padding:9px 12px;border:2px solid #9aa5b1;border-radius:8px;background:#fff;color:inherit}
.bannerRow{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.banner{flex:1 1 auto;background:#fdeaea;border:1px solid #c62828;color:#8e1b1b;border-radius:8px;padding:10px 14px}
.done{margin:0;font-size:24px}
</style>
</head>
<body>
<div class="pair">
  <section class="column" id="panelA"></section>
  <div class="rule"></div>
  <section class="column" id="panelB"></section>
</div>
<script>
// build one panel; opts.canSwitchCard decides whether a second card can be entered
function createPanel(root, opts) {
  var cardSwitched = false;

  function render() {
    cardSwitched = false;
    root.innerHTML =
      '<div class="caption">' + opts.caption + '</div>' +
      '<div class="stage" data-part="stage">' +
        '<h2>Checkout</h2>' +
        '<p class="line">Order total: &euro;48.00</p>' +
        '<div class="cardRow" data-part="cardRow"><span>Card: &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 4242</span></div>' +
        '<div class="bannerRow" data-part="bannerRow" hidden>' +
          '<div class="banner" data-part="banner">Your card was declined. Double-check the card number, or try a different card.</div>' +
        '</div>' +
        '<button type="button" class="primary" data-part="payButton">Pay now</button>' +
      '</div>' +
      '<button type="button" class="restart" data-part="restart">Restart demo</button>';
    root.querySelector('[data-part="payButton"]').addEventListener('click', handlePay);
    root.querySelector('[data-part="restart"]').addEventListener('click', render);
  }

  function showBanner() {
    var row = root.querySelector('[data-part="bannerRow"]');
    row.hidden = false;
    if (opts.canSwitchCard && !row.querySelector('[data-part="switchButton"]')) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'secondary';
      b.setAttribute('data-part', 'switchButton');
      b.textContent = 'Try a different card';
      b.addEventListener('click', handleSwitch);
      row.appendChild(b);
    }
  }

  function handleSwitch() {
    cardSwitched = true;
    var cardRow = root.querySelector('[data-part="cardRow"]');
    cardRow.innerHTML = '<input type="text" data-part="cardInput" placeholder="Card number" aria-label="Card number" autocomplete="off">';
    cardRow.querySelector('input').focus();
  }

  function handlePay() {
    var input = root.querySelector('[data-part="cardInput"]');
    if (cardSwitched && input && input.value.trim() !== '') {
      root.querySelector('[data-part="stage"]').innerHTML = '<p class="done">Payment complete</p>';
      return;
    }
    showBanner();
  }

  render();
}

createPanel(document.getElementById('panelA'), { caption: 'Version A', canSwitchCard: false });
createPanel(document.getElementById('panelB'), { caption: 'Version B', canSwitchCard: true });
</script>
</body>
</html>
